
apiVersion: apps/v1

kind: Deployment
metadata:
  name: iris-ci
  labels:
    app: iris

spec:
  replicas: 1
  selector:
    matchLabels:
      app: iris


  template:
    metadata:
      labels:
        app: iris

    spec:
      containers:
        - name: iris-serve
          image: rajasekar6/iris-ci:a6c933e8b26412488b158229cc82c988b05318f5
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "300m"
              memory: "150Mi"

            limits:
              cpu: "1"
              memory: "256Mi"
          ports:
            - containerPort: 8000
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5

---

apiVersion: v1
kind: Service

metadata:
  name: iris-ci
  labels:
    app: iris



spec:
  selector:
    app: iris



  ports:
    - port: 80
      targetPort: 8000

  type: ClusterIP



