

name: CI-CD

on:
  push:
    branches: [ main ]


jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: pip install -r requirements-dev.txt

      - name: Train the Model
        run: python train.py

      - name: Run Tests
        run: pytest

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: rajasekar6
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and tag image
        run: docker build -t rajasekar6/iris-ci:${{ github.sha }} -t rajasekar6/iris-ci:latest .

      - name: Push image
        run: docker push --all-tags rajasekar6/iris-ci


  update-manifest:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    needs: build-and-push

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Update Sha
        run: sed -i "s|rajasekar6/iris-ci:.*|rajasekar6/iris-ci:${{ github.sha }}|" k8s/iris.yaml


      - name: Git Config, Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet k8s/iris.yaml; then
            git add k8s/iris.yaml
            git commit -m " Updated the k8s/iris.yaml iris image with ${{ github.sha }}"
            git push 
          fi 
          
          
        
